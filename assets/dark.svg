<svg width="436" height="512" viewBox="0 0 436 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <radialGradient id="glowA-dark" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
      <animate attributeName="cx" values="20%;30%;20%" dur="9s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="glowB-dark" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
      <animate attributeName="cx" values="85%;72%;85%" dur="11s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="glowC-dark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="asciiGrad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#22D3EE;#10B981;#A855F7" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#A855F7;#22D3EE" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#A855F7;#22D3EE;#10B981" dur="7s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;0 -20;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGrad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity=".9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="reflect-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanGrad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-dark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow-dark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <clipPath id="cardClip-dark">
      <rect x="22" y="22" width="392.0" height="468.0" rx="22"/>
    </clipPath>

    <style>
      .ascii-row { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9.8px; letter-spacing: -0.3px; fill: url(#asciiGrad-dark); filter: url(#glow-dark); }
      .label { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="436" height="512" fill="#030712"/>

  <g filter="url(#softShadow-dark)">
    <rect x="22" y="22" width="392.0" height="468.0" rx="22" fill="url(#bgGrad-dark)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  </g>

  <g clip-path="url(#cardClip-dark)">
    <rect x="22" y="22" width="392.0" height="468.0" fill="url(#glowA-dark)"/>
    <rect x="22" y="22" width="392.0" height="468.0" fill="url(#glowB-dark)"/>
    <rect x="22" y="22" width="392.0" height="468.0" fill="url(#glowC-dark)"/>

    <!-- glass reflection -->
    <polygon points="22,22 237.6,22 139.6,490.0 22,490.0" fill="url(#reflect-dark)"/>

    <!-- top bar traffic lights -->
    <circle cx="44" cy="44" r="4.2" fill="#EF4444" opacity="0.85"/>
    <circle cx="60" cy="44" r="4.2" fill="#F59E0B" opacity="0.85"/>
    <circle cx="76" cy="44" r="4.2" fill="#10B981" opacity="0.85"/>
    <text x="218.0" y="48" text-anchor="middle" class="label" font-size="11" fill="#94A3B8" letter-spacing="1.5">portrait.ascii</text>
    <line x1="22" y1="60" x2="414.0" y2="60" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

